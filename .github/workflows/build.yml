name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la versión a publicar (p. ej. v0.1.0). Vacío = solo compilar.'
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests del núcleo (parsers, reloj, sincronía, proveedores)
        run: dotnet test tests/Versalia.Core.Tests -c Release

      - name: Publicar Versalia.exe (autónomo, no necesita instalar .NET)
        run: >
          dotnet publish src/Versalia.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o artifacts/publish

      - name: Empaquetar zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/zip | Out-Null
          Copy-Item artifacts/publish/Versalia.exe artifacts/zip/
          Copy-Item scripts/Instalar-Versalia.ps1, scripts/Desinstalar-Versalia.ps1 artifacts/zip/
          Copy-Item README.md artifacts/zip/LEEME.md
          Compress-Archive -Path artifacts/zip/* -DestinationPath artifacts/Versalia-Windows-x64.zip -Force
          Get-Item artifacts/Versalia-Windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Versalia-Windows-x64
          path: artifacts/Versalia-Windows-x64.zip

      - name: Versión de prueba (dev-latest) en cada push a main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --cleanup-tag --yes 2>$null
          gh release create dev-latest artifacts/Versalia-Windows-x64.zip --prerelease `
            --title "Versión de prueba (último main)" --target $env:GITHUB_SHA `
            --notes "Compilada automáticamente desde main. Descárgala desde el navegador."

      - name: Publicar versión (etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create $env:TAG artifacts/Versalia-Windows-x64.zip --title "Versalia $env:TAG" `
            --notes "Versalia para Windows 11. Instrucciones en el LEEME del zip."
